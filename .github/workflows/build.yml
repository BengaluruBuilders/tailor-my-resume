name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'title' || 'full' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  policy:
    name: "Constitution policy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: policy-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Constitution VI.2::Use the PR title format type(scope): summary"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          version=8.30.1
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          GITLEAKS="$RUNNER_TEMP/gitleaks/gitleaks" tools/ci/scan-secrets.sh

      - name: Test the secret scan script
        env:
          REAL_GITLEAKS: ${{ runner.temp }}/gitleaks/gitleaks
        run: tools/ci/test-scan-secrets.sh

      - name: Check constitution rules
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: tools/ci/check-constitution.sh

  changes:
    name: "Detect code changes"
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Find changed code files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_files="$(git diff --name-only HEAD^1 HEAD | grep -vE '^(docs|design)/|\.md$' || true)"
          if [[ -n "$code_files" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::This PR changes only docs, design, or Markdown files."
          fi

  static:
    name: "Static checks"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          :build-logic:convention:check
          spotlessCheck
          -PwarningsAsErrors=true
          --continue

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-static
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/spotless/
            **/build/reports/tests/
            **/build/test-results/

  unit-core:
    name: "Core unit tests"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          :core:common:testDebugUnitTest
          :core:data:testDebugUnitTest
          :core:database:testDebugUnitTest
          :core:designsystem:testDebugUnitTest
          :core:domain:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:navigation:testDebugUnitTest
          :core:screenshot:testDebugUnitTest
          :core:testing:testDebugUnitTest
          :core:domain:koverVerify
          :core:data:koverVerify
          -PwarningsAsErrors=true
          --continue

      - name: Check Room schema is committed
        run: |
          if [[ -n "$(git status --porcelain -- core/database/schemas)" ]]; then
            git status --short -- core/database/schemas
            echo "::error title=Constitution V.6::Room schema changed. Commit the exported schema and add a migration."
            exit 1
          fi

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-core
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/reports/kover/
            **/build/test-results/

  unit-feature:
    name: "Feature unit tests"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          :feature:applications:api:testDebugUnitTest
          :feature:applications:impl:testDebugUnitTest
          :feature:onboarding:api:testDebugUnitTest
          :feature:onboarding:impl:testDebugUnitTest
          :feature:profile:api:testDebugUnitTest
          :feature:profile:impl:testDebugUnitTest
          :feature:settings:api:testDebugUnitTest
          :feature:settings:impl:testDebugUnitTest
          :feature:analysis:api:testDebugUnitTest
          :feature:analysis:impl:testDebugUnitTest
          :feature:tailor:api:testDebugUnitTest
          :feature:tailor:impl:testDebugUnitTest
          -PwarningsAsErrors=true
          --continue

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-feature
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/test-results/

  unit-app:
    name: "App unit tests"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          :app:testDemoDebugUnitTest
          :app:testProdDebugUnitTest
          -PwarningsAsErrors=true
          --continue

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-app
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/test-results/

  screenshots:
    name: "Screenshot tests"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          verifyRoborazziDebug
          -PwarningsAsErrors=true
          --continue

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-screenshots
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
            **/build/test-results/

  lint:
    name: "Lint"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          lintRelease
          :app:lintDemoRelease
          :app:lintProdRelease
          -PwarningsAsErrors=true
          --continue

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-lint
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/lint-results-*.html

  assemble:
    name: "Assemble APKs"
    needs: changes
    if: github.event.action != 'edited' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test the release config
        run: tools/ci/test-release-config.sh

      - name: Run Gradle tasks
        run: >-
          ./gradlew
          assembleDebug
          assembleRelease
          :app:dependencyGuard
          -PwarningsAsErrors=true
          --continue

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-assemble
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/dependency-guard/
            **/build/outputs/apk/

  build:
    name: "Build, lint, and unit tests"
    needs: [changes, static, unit-core, unit-feature, unit-app, screenshots, lint, assemble]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          if [[ "$CHANGES" == "skipped" ]]; then
            exit 0
          fi
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::Detect code changes finished with $CHANGES"
            exit 1
          fi
          wanted=success
          if [[ "$CODE_CHANGED" != "true" ]]; then
            wanted=skipped
          fi
          for result in $RESULTS; do
            if [[ "$result" != "$wanted" && "$result" != "success" ]]; then
              echo "::error::A shard finished with $result"
              exit 1
            fi
          done
