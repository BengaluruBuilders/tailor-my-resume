name: Release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-bundle
  cancel-in-progress: false

jobs:
  bundle:
    name: "Signed prod bundle"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.TMR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "TMR_UPLOAD_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed prod bundle
        env:
          TMR_UPLOAD_STORE_PASSWORD: ${{ secrets.TMR_UPLOAD_STORE_PASSWORD }}
          TMR_UPLOAD_KEY_ALIAS: ${{ secrets.TMR_UPLOAD_KEY_ALIAS }}
          TMR_UPLOAD_KEY_PASSWORD: ${{ secrets.TMR_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_tailormyresumeWebClientId: ${{ secrets.TMR_WEB_CLIENT_ID }}
          ORG_GRADLE_PROJECT_tailormyresumeFirebaseApiKey: ${{ secrets.TMR_FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_tailormyresumeFirebaseAppId: ${{ secrets.TMR_FIREBASE_APP_ID }}
          ORG_GRADLE_PROJECT_tailormyresumeFirebaseProjectId: ${{ secrets.TMR_FIREBASE_PROJECT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_OFFSET: ${{ vars.TMR_VERSION_CODE_OFFSET }}
          TMR_VERSION_NAME: ${{ vars.TMR_VERSION_NAME }}
        run: |
          offset="${VERSION_CODE_OFFSET:-0}"
          if [[ ! "$offset" =~ ^[0-9]+$ ]]; then
            echo "TMR_VERSION_CODE_OFFSET must be a non-negative integer, got '$offset'" >&2
            exit 1
          fi
          export TMR_VERSION_CODE=$((10#$RUN_NUMBER + 10#$offset))
          ./gradlew :app:bundleRelease -PwarningsAsErrors=true

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aab
          retention-days: 3
          if-no-files-found: error
          path: app/build/outputs/bundle/release/*.aab

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
